<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  </head>
  <body>
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        <div class="github-stars-container">
          <a class="github-stars-link" href="https://github.com/aisoft-course/aisoft-course.github.io" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" style="vertical-align: middle; margin-right: 4px;">
              <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.695Z"/>
            </svg>
            <span id="github-star-count">Star</span>
          </a>
        </div>
        {{ content }}
      </div>
    </main>
    <script>
      (async function() {
        try {
          const res = await fetch('https://api.github.com/repos/aisoft-course/aisoft-course.github.io');
          if (res.ok) {
            const data = await res.json();
            const count = data.stargazers_count;
            if (count !== undefined) {
              const el = document.getElementById('github-star-count');
              el.textContent = 'Star ' + count;
            }
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
